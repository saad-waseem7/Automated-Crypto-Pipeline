version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    ignore:
      # numpy 2.5 dropped Python 3.11, which the image and CI target.
      - dependency-name: numpy
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
