name: CI/CD

# Pull requests: lint, type check, test, build the image and smoke test it (no push).
# Push to main: all of the above, then publish the image to GHCR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be publishing an image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: black
        run: black --check .

      - name: flake8
        run: flake8 .

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest --cov

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate docker compose file
        run: docker compose --env-file .env.example --profile airflow --profile seed config -q

  image:
    name: Build, smoke test, publish
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build runtime image (local, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          target: runtime
          load: true
          push: false
          tags: btc-forecast-api:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Build seed image (local, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          target: seed
          load: true
          push: false
          tags: btc-forecast-seed:ci
          cache-from: type=gha,scope=runtime

      - name: Container smoke test
        run: scripts/smoke_test.sh btc-forecast-api:ci btc-forecast-seed:ci

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (commit SHA and latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
