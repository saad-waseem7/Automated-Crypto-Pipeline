name: CI/CD

# Pull requests: lint, type check, test, build the image and smoke test it (no push).
# Push to main: all of the above, then publish the image to GHCR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be publishing an image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: black
        run: black --check .

      - name: flake8
        run: flake8 .

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest --cov

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate docker compose file
        run: docker compose --env-file .env.example --profile airflow --profile seed config -q

  kubeflow:
    name: Kubeflow spec is up to date
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-kfp.txt

      - run: pip install -r requirements-kfp.txt

      - name: Compile the pipeline
        run: python kubeflow/btc_kfp_pipeline.py

      - name: Committed YAML must match the compiled output
        run: git diff --exit-code -- kubeflow/btc_kfp_pipeline.yaml

  airflow-e2e:
    name: Airflow DAG end-to-end
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN: ci-token-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      # numpy is only needed by the fake Binance server that runs on the host.
      - run: pip install -r app/requirements.txt

      - name: Build the API and Airflow images
        run: |
          docker build -f app/Dockerfile --target runtime -t btc-forecast-api:ci .
          docker build -f airflow/Dockerfile -t btc-forecast-airflow:ci .

      - name: Start the fake Binance server and the API (no model yet)
        run: |
          mkdir -p "$RUNNER_TEMP/models" "$RUNNER_TEMP/data"
          chmod 1777 "$RUNNER_TEMP/models" "$RUNNER_TEMP/data"
          nohup python -m scripts.fake_binance --port 8765 --days 1500 > "$RUNNER_TEMP/fake.log" 2>&1 &
          docker run -d --name api --network host \
            -v "$RUNNER_TEMP/models:/app/models:ro" \
            -e RELOAD_TOKEN="$TOKEN" -e MODEL_POLL_SECONDS=1 \
            btc-forecast-api:ci
          for _ in $(seq 1 30); do curl -fs localhost:5000/health >/dev/null && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:5000/ready)
          test "$code" = "503" || { echo "expected /ready 503 before training, got $code"; exit 1; }

      - name: Run the DAG in a real Airflow
        run: |
          docker run --rm --network host \
            -e BINANCE_BASE_URLS=http://127.0.0.1:8765 \
            -e MODEL_DIR=/models -e BTC_DATA_DIR=/data \
            -e API_RELOAD_URL=http://127.0.0.1:5000/reload -e RELOAD_TOKEN="$TOKEN" \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -v "$RUNNER_TEMP/models:/models" -v "$RUNNER_TEMP/data:/data" \
            -v "$PWD/src:/opt/airflow/project/src:ro" -v "$PWD/dags:/opt/airflow/dags:ro" \
            btc-forecast-airflow:ci \
            bash -c "airflow db migrate && airflow dags test btc_etl_pipeline"

      - name: The API must now serve the model Airflow trained
        run: |
          test -s "$RUNNER_TEMP/models/CURRENT"
          grep -q '"status": "promoted"' "$RUNNER_TEMP/data/reports/last_train.json"
          scripts/check_api.sh http://127.0.0.1:5000
          curl -fs localhost:5000/metrics | python -c "import json,sys; m=json.load(sys.stdin)['metrics']; assert m['data_source']=='binance:BTCUSDT', m"

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker logs api || true
          cat "$RUNNER_TEMP/fake.log" || true
          find "$RUNNER_TEMP/models" "$RUNNER_TEMP/data" | head -50

  k8s-e2e:
    name: Kubernetes end to end (kind)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NS: btc-forecast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Build the image
        run: docker build -f app/Dockerfile --target runtime -t btc-forecast-api:ci .

      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: btc
          config: .github/kind-config.yaml

      - name: Load the image into the cluster
        run: kind load docker-image btc-forecast-api:ci --name btc

      - name: Install ingress-nginx and metrics-server
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          # kind kubelets use self-signed certificates.
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=180s
          kubectl -n ingress-nginx wait --for=condition=complete job/ingress-nginx-admission-patch --timeout=120s

      - name: Serve synthetic candles to the cluster
        run: |
          gateway="$(docker network inspect kind -f '{{(index .IPAM.Config 0).Gateway}}')"
          echo "GATEWAY=$gateway" >> "$GITHUB_ENV"
          python -m scripts.fake_binance --host 0.0.0.0 --port 8765 --days 1500 > fake.log 2>&1 &
          for _ in $(seq 20); do curl -fs "http://127.0.0.1:8765/api/v3/klines?limit=1" >/dev/null && break; sleep 1; done

      - name: Render manifests for CI (local image, fake Binance)
        run: |
          cp -r k8s k8s-ci
          sed -i 's|newTag: .*|newName: btc-forecast-api\n    newTag: ci|' k8s-ci/kustomization.yaml
          sed -i "s|BINANCE_BASE_URLS: .*|BINANCE_BASE_URLS: \"http://${GATEWAY}:8765\"|" k8s-ci/configmap.yaml
          cat k8s-ci/kustomization.yaml

      - name: Deploy
        run: |
          kubectl apply -f k8s-ci/namespace.yaml
          kubectl -n "$NS" create secret generic btc-forecast-secret --from-literal=RELOAD_TOKEN=ci-reload-token-0123456789
          kubectl apply -k k8s-ci

      - name: Pods must not be Ready before a model exists
        run: |
          sleep 15
          ready="$(kubectl -n "$NS" get deploy btc-forecast -o jsonpath='{.status.readyReplicas}')"
          test -z "$ready" || test "$ready" = "0"
          kubectl -n "$NS" get pods

      - name: Train in the cluster and wait for readiness
        run: |
          kubectl -n "$NS" create job ci-train --from=cronjob/btc-train
          kubectl -n "$NS" wait --for=condition=complete job/ci-train --timeout=300s \
            || { kubectl -n "$NS" logs job/ci-train; exit 1; }
          kubectl -n "$NS" logs job/ci-train | tail -20
          kubectl -n "$NS" rollout status deployment/btc-forecast --timeout=180s
          test "$(kubectl -n "$NS" get deploy btc-forecast -o jsonpath='{.status.readyReplicas}')" = "3"

      - name: Predict through the ingress
        run: |
          curl -fsS -H 'Host: btc-forecast.local' http://127.0.0.1/ready
          curl -fsS -X POST -H 'Host: btc-forecast.local' http://127.0.0.1/predict \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert len(d["predictions"])==7, d'

      - name: Self-healing, a deleted pod is replaced without dropped requests
        run: |
          victim="$(kubectl -n "$NS" get pods -l app.kubernetes.io/name=btc-forecast -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n "$NS" delete pod "$victim" --wait=false
          failures=0
          for _ in $(seq 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Host: btc-forecast.local' http://127.0.0.1/predict)"
            test "$code" = "200" || failures=$((failures + 1))
            sleep 0.5
          done
          echo "non-200 responses during pod replacement: $failures"
          test "$failures" -le 2
          kubectl -n "$NS" rollout status deployment/btc-forecast --timeout=120s
          test "$(kubectl -n "$NS" get deploy btc-forecast -o jsonpath='{.status.readyReplicas}')" -ge 3

      - name: HPA reports CPU metrics
        run: |
          for _ in $(seq 36); do
            current="$(kubectl -n "$NS" get hpa btc-forecast -o jsonpath='{.status.currentMetrics[0].resource.current.averageUtilization}')"
            test -n "$current" && break
            sleep 5
          done
          kubectl -n "$NS" get hpa
          test -n "$current"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" get all,pvc,ingress -o wide || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs -l app.kubernetes.io/name=btc-forecast --tail=50 || true
          kubectl -n "$NS" logs -l app.kubernetes.io/name=btc-train --tail=50 || true

  image:
    name: Build, smoke test, publish
    needs: [quality, kubeflow, airflow-e2e, k8s-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build runtime image (local, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          target: runtime
          load: true
          push: false
          tags: btc-forecast-api:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Build seed image (local, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          target: seed
          load: true
          push: false
          tags: btc-forecast-seed:ci
          cache-from: type=gha,scope=runtime

      - name: Container smoke test
        run: scripts/smoke_test.sh btc-forecast-api:ci btc-forecast-seed:ci

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (commit SHA and latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
