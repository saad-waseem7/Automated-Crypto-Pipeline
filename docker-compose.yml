# Local integration stack.
#
#   cp .env.example .env            # then edit the values
#   docker compose run --rm seed    # one-off: write a SYNTHETIC model to the volume
#   docker compose up -d --build    # API on http://localhost:5000
#   docker compose --profile airflow up -d   # adds Postgres + Airflow UI on :8080
#
# The API mounts the model volume read-only; only trainers (and the seed job) write.

name: btc-forecast

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-airflow}

services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: runtime
    image: btc-forecast-api:local
    ports:
      - "5000:5000"
    environment:
      MODEL_DIR: /app/models
      MODEL_STAGE: local
      MODEL_POLL_SECONDS: "5"
      LOG_LEVEL: INFO
      RELOAD_TOKEN: ${RELOAD_TOKEN:?set RELOAD_TOKEN in .env}
    volumes:
      - models:/app/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: seed
    image: btc-forecast-seed:local
    volumes:
      - models:/app/models
    profiles: ["seed"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["airflow"]
    restart: unless-stopped

  # One-shot: make the shared volumes writable by Airflow (uid 50000). The model
  # volume stays world-writable with the sticky bit so the API user (10001) and
  # Airflow can both use it. Local development only, Kubernetes uses fsGroup.
  init-volumes:
    image: busybox:1.37
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/raw /data/processed /data/reports
        && chown -R 50000:0 /data
        && chmod 1777 /models
    volumes:
      - models:/models
      - btc-data:/data
    profiles: ["airflow"]

  # Single-container Airflow (api-server, scheduler, dag-processor, triggerer).
  # Chosen over the multi-service layout to stay inside a 16 GB laptop budget.
  # Our code runs in a separate venv baked into this image (see airflow/Dockerfile).
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: btc-forecast-airflow:local
    command: standalone
    environment:
      <<: *airflow-env
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      BTC_PROJECT_DIR: /opt/airflow/project
      BTC_DATA_DIR: /opt/airflow/data
      MODEL_DIR: /models
      API_RELOAD_URL: http://api:5000/reload
      RELOAD_TOKEN: ${RELOAD_TOKEN:?set RELOAD_TOKEN in .env}
      BINANCE_BASE_URLS: ${BINANCE_BASE_URLS:-}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src:ro
      - models:/models
      - btc-data:/opt/airflow/data
    depends_on:
      postgres:
        condition: service_healthy
      init-volumes:
        condition: service_completed_successfully
    profiles: ["airflow"]
    restart: unless-stopped

volumes:
  models:
  pgdata:
  btc-data:
