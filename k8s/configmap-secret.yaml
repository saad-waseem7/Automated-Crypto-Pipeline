# Non-sensitive settings live in the ConfigMap, sensitive ones in the Secret.
# Both are injected as environment variables (envFrom / secretKeyRef).
apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-forecast-config
  namespace: btc-forecast
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  MODEL_DIR: "/app/models"
  MODEL_POLL_SECONDS: "10"
  WEB_CONCURRENCY: "2"
  GUNICORN_THREADS: "2"
  # Comma-separated Binance hosts, tried in order by the training job.
  BINANCE_BASE_URLS: "https://api.binance.com,https://data-api.binance.vision"
---
# RELOAD_TOKEN is empty on purpose: an empty token disables POST /reload (404),
# so applying this file as-is never leaves a guessable credential in the cluster.
# scripts/k8s_up.sh generates a random token and stores it here at deploy time,
# and re-applying keeps it. Never commit a real value.
apiVersion: v1
kind: Secret
metadata:
  name: btc-forecast-secret
  namespace: btc-forecast
type: Opaque
stringData:
  RELOAD_TOKEN: ""
