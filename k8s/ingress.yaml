apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: btc-forecast
  namespace: btc-forecast
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: btc-forecast.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: btc-forecast
                port:
                  name: http
