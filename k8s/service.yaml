apiVersion: v1
kind: Service
metadata:
  name: btc-forecast
  namespace: btc-forecast
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: btc-forecast
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Direct access without the ingress: http://$(minikube ip):30080
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-nodeport
  namespace: btc-forecast
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: btc-forecast
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
