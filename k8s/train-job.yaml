# Daily in-cluster retraining: fetch, features, train, gate. The trainer
# publishes atomically to the shared volume and the API pods pick the new
# version up by polling CURRENT, so no restart or API call is needed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: btc-train
  namespace: btc-forecast
spec:
  schedule: "15 0 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: btc-train
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: train
              image: ghcr.io/saad-waseem7/automated-crypto-pipeline:latest
              imagePullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - |
                  python -m src.etl_fetch
                  python -m src.features
                  python -m src.train_forecast
                  cat "$BTC_REPORT_PATH"
              envFrom:
                - configMapRef:
                    name: btc-forecast-config
              env:
                - name: BTC_RAW_PATH
                  value: /work/raw/btc_usdt_1d.csv
                - name: BTC_FEATURES_PATH
                  value: /work/processed/features.csv
                - name: BTC_REPORT_PATH
                  value: /work/reports/last_train.json
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: models
                  mountPath: /app/models
                - name: work
                  mountPath: /work
          volumes:
            - name: models
              persistentVolumeClaim:
                claimName: btc-models
            # Raw candles are re-fetched from 2017 each run (about 10 requests).
            - name: work
              emptyDir:
                sizeLimit: 64Mi
