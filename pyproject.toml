[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app", "src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "src", "scripts"]
plugins = []

[[tool.mypy.overrides]]
module = ["gunicorn.*"]
ignore_missing_imports = true
